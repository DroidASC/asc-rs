[package]
name = "asc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "High-level asc-rs engine: parallel APK class lookup, cross-DEX reference search, single-class rebuild + disassembly, manifest decoding."

[dependencies]
asc-dex.workspace = true
asc-apk.workspace = true
asc-cache.workspace = true
asc-findrefs.workspace = true
asc-rebuild.workspace = true
asc-smali.workspace = true
asc-axml.workspace = true
asc-arsc.workspace = true
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

# sha2 0.10 uses the ARMv8 SHA2 instructions only with `asm` (x86 picks
# SHA-NI at run time either way). In software, hashing DEX entries for the
# cross-APK dedup costs more than the scan it saves.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

# Memory statistics on Apple systems (`budget::apple`).
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[dev-dependencies]
asc-fixture.workspace = true
tempfile.workspace = true
