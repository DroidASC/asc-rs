[package]
name = "asc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Query an APK or HarmonyOS HAP like a read-only database: classes, cross-references, disassembly and manifest in milliseconds, no preprocessing. CLI + MCP for humans and agents."
readme = "../../README.en.md"
keywords = ["android", "dex", "apk", "smali", "reverse-engineering"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "asc"
path = "src/main.rs"

[dependencies]
asc-ark-engine.workspace = true
asc-engine.workspace = true
asc-findrefs.workspace = true
asc-mcp.workspace = true
clap.workspace = true
libc = "0.2"
serde_json.workspace = true

[dev-dependencies]
asc-fixture.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# `cargo binstall asc-cli` fetches the archives built by the Release workflow.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/asc-v{ version }-{ target }.tar.gz"
bin-dir = "asc-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.release]
tag = true
