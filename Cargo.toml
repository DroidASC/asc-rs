[workspace]
resolver = "2"
members = [
    "crates/asc-dex",
    "crates/asc-dalvik",
    "crates/asc-findrefs",
    "crates/asc-rebuild",
    "crates/asc-smali",
    "crates/asc-apk",
    "crates/asc-cache",
    "crates/asc-axml",
    "crates/asc-arsc",
    "crates/asc-engine",
    "crates/asc-mcp",
    "crates/asc-cli",
    "crates/asc-fixture",
    "crates/harmony/asc-abc",
    "crates/harmony/asc-arkisa",
    "crates/harmony/asc-pasm",
    "crates/harmony/asc-ark-engine",
    "crates/harmony/asc-hap",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Ylarod/asc-rs"
rust-version = "1.98"

[workspace.dependencies]
asc-dex = { path = "crates/asc-dex" }
asc-dalvik = { path = "crates/asc-dalvik" }
asc-findrefs = { path = "crates/asc-findrefs" }
asc-rebuild = { path = "crates/asc-rebuild" }
asc-smali = { path = "crates/asc-smali" }
asc-apk = { path = "crates/asc-apk" }
asc-cache = { path = "crates/asc-cache" }
asc-axml = { path = "crates/asc-axml" }
asc-arsc = { path = "crates/asc-arsc" }
asc-engine = { path = "crates/asc-engine" }
asc-mcp = { path = "crates/asc-mcp" }
asc-fixture = { path = "crates/asc-fixture" }
asc-abc = { path = "crates/harmony/asc-abc" }
asc-arkisa = { path = "crates/harmony/asc-arkisa" }
asc-pasm = { path = "crates/harmony/asc-pasm" }
asc-ark-engine = { path = "crates/harmony/asc-ark-engine" }
asc-hap = { path = "crates/harmony/asc-hap" }

thiserror = "2"
memmap2 = "0.9"
bytemuck = "1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
regex = "1.11"
regex-syntax = "0.8"
memchr = "2.7"
clap = { version = "4.5", features = ["derive"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tempfile = "3"
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
# Unwind so `asc mcp` can turn a panic in one tool call into an error result.
panic = "unwind"
debug = false
opt-level = 3

[profile.bench]
inherits = "release"
