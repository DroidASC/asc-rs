[package]
name = "asc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Droid ASC command line: getclass / getmanifest / findrefs over an APK without preprocessing."

[[bin]]
name = "droidasc"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:asc-gui"]

[dependencies]
asc-engine.workspace = true
asc-findrefs.workspace = true
asc-mcp.workspace = true
asc-gui = { path = "../asc-gui", optional = true }
clap.workspace = true

[dev-dependencies]
asc-fixture.workspace = true
serde_json.workspace = true
tempfile.workspace = true
