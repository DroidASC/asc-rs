name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      # The tests that need the real asc-dexdec-worker (it is built in its
      # own repository) skip themselves unless ASC_DEXDEC_WORKER names one.
      - run: cargo test --workspace --no-default-features
      # The installer (asc-cli's default `installer` feature) against a local server.
      - run: cargo clippy -p asc-frontend --all-targets --features installer -- -D warnings
      - run: cargo test -p asc-frontend --features installer
  # The release binary, as the Release workflow builds it (fat LTO).
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-asc
      - run: cargo build --release --locked -p asc-cli
  # Broken intra-doc links and public docs naming private items fail here.
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  # Code under cfg(target_os = "macos") is compiled nowhere else: lint it on
  # macOS (the release builds for both macOS targets).
  clippy-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
